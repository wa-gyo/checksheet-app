name: Record Daily Weather at 08:00 JST

on:
  schedule:
    # 日本時間 08:15 (UTC 23:15) に設定（00分の混雑を回避）
    - cron: '15 23 * * *'
  workflow_dispatch:

jobs:
  fetch-and-store-weather:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Open-Meteo & Insert into Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          node -e '
            async function main() {
              const LAT = 37.5282;
              const LON = 139.9465;

              const now = new Date();
              const jstNow = new Date(now.getTime() + (9 * 60 * 60 * 1000));
              const dateStr = jstNow.toISOString().slice(0, 10);
              const targetTimeStr = `${dateStr}T08:00`;
              const recordedAt = `${dateStr}T08:00:00+09:00`;

              const parseWmo = (code) => {
                if (code === 0) return "☀️ 快晴";
                if (code === 1 || code === 2) return "🌤 晴れ";
                if (code === 3) return "☁️ 曇り";
                if (code === 45 || code === 48) return "🌫️ 霧";
                if (code >= 51 && code <= 55) return "🌦️ 霧雨";
                if (code >= 61 && code <= 65) return "🌧️ 雨";
                if (code >= 71 && code <= 77) return "❄️ 雪";
                if (code >= 80 && code <= 82) return "🌧️ にわか雨";
                if (code >= 85 && code <= 86) return "🌨️ にわか雪";
                if (code >= 95) return "⚡ 雷雨";
                return "☁️ 曇り";
              };

              // hourly から 1時間ごとのデータを取得（降水量・降雪量も含む）
              const weatherUrl = `https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&hourly=temperature_2m,relative_humidity_2m,weather_code,precipitation,snowfall&timezone=Asia%2FTokyo`;
              
              const resWeather = await fetch(weatherUrl);
              const weatherJson = await resWeather.json();

              // 何時にアクションが起動しても、確実に "08:00" のインデックスを探す
              const timeIndex = weatherJson.hourly.time.findIndex(t => t === targetTimeStr);
              const idx = timeIndex !== -1 ? timeIndex : 8;

              const temp = weatherJson.hourly.temperature_2m[idx];
              const hum = weatherJson.hourly.relative_humidity_2m[idx];
              const code = weatherJson.hourly.weather_code[idx];
              const prec = weatherJson.hourly.precipitation ? weatherJson.hourly.precipitation[idx] : 0;
              const snow = weatherJson.hourly.snowfall ? weatherJson.hourly.snowfall[idx] : 0;

              const baseUrl = (process.env.SUPABASE_URL || "").trim().replace(/\/+$/, "");
              const apiKey = (process.env.SUPABASE_KEY || "").trim();
              const targetUrl = `${baseUrl}/rest/v1/daily_weather_logs`;

              const payload = [{
                target_date: dateStr,
                recorded_at: recordedAt,
                weather_text: parseWmo(code),
                temperature: Math.round(temp * 10) / 10,
                humidity: Math.round(hum),
                precipitation: Math.round(prec * 10) / 10,
                snowfall: Math.round(snow * 10) / 10
              }];

              const resDb = await fetch(targetUrl, {
                method: "POST",
                headers: {
                  "apikey": apiKey,
                  "Authorization": `Bearer ${apiKey}`,
                  "Content-Type": "application/json",
                  "Prefer": "resolution=merge-duplicates"
                },
                body: JSON.stringify(payload)
              });

              console.log("Supabase response status:", resDb.status);

              if (!resDb.ok) {
                const errText = await resDb.text();
                console.error("Supabase error response:", errText);
                process.exit(1);
              }

              console.log("Successfully stored weather for:", dateStr, "At target time:", targetTimeStr, "Payload:", payload[0]);
            }

            main().catch((err) => {
              console.error(err);
              process.exit(1);
            });
          '

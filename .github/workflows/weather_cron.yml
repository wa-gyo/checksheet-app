name: Record Daily Weather at 08:00 JST

on:
  schedule:
    # 日本時間 08:15 (UTC 23:15) に設定（00分の混雑を回避）
    - cron: '15 23 * * *'
    # 予備: 日本時間 11:45 (UTC 02:45)。朝の実行が失敗しても記録できるように（同じ日付は上書きなので重複しない）
    - cron: '45 2 * * *'
  workflow_dispatch:
    inputs:
      target_date:
        description: '記録する日付（YYYY-MM-DD）。空欄なら今日。記録漏れの日を後から埋めるときに指定'
        required: false
        default: ''

jobs:
  fetch-and-store-weather:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts

      - name: Fetch Open-Meteo & Insert into Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TARGET_DATE: ${{ inputs.target_date }}
        run: node .github/scripts/record_weather.mjs
